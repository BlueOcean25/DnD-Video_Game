<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Video Game - 3D Environment</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
        }
        
        /* Touchscreen Joystick Outer Ring styling */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none; 
            display: none;      
        }

        /* Touchscreen Joystick Inner Red Thumb Knob styling */
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
    </style>
    <!-- WebGL 3D graphics rendering core blueprint library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP THE 3D SCENE & ENGINE CANVAS
        // ==========================================
        const scene = new THREE.Scene();
        
        // Dynamic perspective adjustment for true 3D spatial viewing
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Position camera behind and looking down onto the map environment
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 1, 0);

        // ==========================================
        // 2. ADD FLOOR SURFACE & REAL-TIME GRAVITY SETTINGS
        // ==========================================
        // Create an organic structural wireframe ground floor
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = Math.PI / 2; // Flat ground rotation placement
        scene.add(floor);

        // Add a structural alignment utility tracking grid over the floor mesh
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Kinematic Gravity State Variables
        const gravity = -0.015;      // Downward acceleration per tick
        let verticalVelocity = 0;   // Instant vertical trajectory
        let isGrounded = true;       // Floor attachment boundary flag

        // ==========================================
        // 3. CREATE YOUR CHARACTER TOKEN (GREEN CUBE)
        // ==========================================
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        
        // Pivot initialization offset forcing bottom surface boundary placement to align cleanly with floor level
        cube.position.set(0, 1, 0);
        scene.add(cube);

        // ==========================================
        // 4. PERSISTENT LIVE WEBSOCKET SERVER TUNNEL
        // ==========================================
        const socket = new WebSocket('wss://dnd-video-game.onrender.com');
        const remotePlayers = {};
        
        socket.playerId = Math.random().toString(36).substring(7);

        // HANDSHAKE SIGNAL: Tell the server we just joined, and request positions!
        socket.onopen = function() {
            socket.send(JSON.stringify({
                type: 'join', 
                id: socket.playerId,
                x: cube.position.x,
                y: cube.position.y,
                z: cube.position.z
            }));
        };

        // Helper event emitter utility dispatching coordinates packet over the active connection network
        function broadcastMovement() {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'move',
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y,
                    z: cube.position.z
                }));
            }
        }

        // ==========================================
        // 5. LISTENING FOR SIGNALS FROM THE SERVER
        // ==========================================
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.id === socket.playerId) return;

            // AUTOMATIC GREETING REPLY
            if (data.type === 'join') {
                socket.send(JSON.stringify({
                    type: 'reply', 
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y,
                    z: cube.position.z
                }));
            }

            // CLEAN DISCONNECT REMOVAL ACTION LOGIC
            if (data.type === 'leave') {
                if (remotePlayers[data.id]) {
                    scene.remove(remotePlayers[data.id]);
                    remotePlayers[data.id].geometry.dispose();
                    remotePlayers[data.id].material.dispose();
                    delete remotePlayers[data.id];
                }
                return;
            }

            // Build or update the red cube for the other player
            if (!remotePlayers[data.id]) {
                const remoteGeometry = new THREE.BoxGeometry(2, 2, 2);
                const remoteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                remotePlayers[data.id] = new THREE.Mesh(remoteGeometry, remoteMaterial);
                scene.add(remotePlayers[data.id]);
            }
            
            // Map tracking fields to the proper 3D coordinates
            remotePlayers[data.id].position.x = data.x;
            remotePlayers[data.id].position.y = data.y;
            remotePlayers[data.id].position.z = data.z !== undefined ? data.z : 0;
        };

        // ==========================================
        // 6. LAPTOP & COMPUTER ARROW KEYBOARD INPUTS
        // ==========================================
        window.addEventListener('keydown', (event) => {
            let moved = false;
            
            // X & Z movement handles translation across flat ground terrain
            if (event.key === 'ArrowUp' || event.key === 'w') { cube.position.z -= 0.3; moved = true; }
            if (event.key === 'ArrowDown' || event.key === 's') { cube.position.z += 0.3; moved = true; }
            if (event.key === 'ArrowLeft' || event.key === 'a') { cube.position.x -= 0.3; moved = true; }
            if (event.key === 'ArrowRight' || event.key === 'd') { cube.position.x += 0.3; moved = true; }
            
            // JUMP MECHANIC: Apply instantaneous vertical impulse velocity when standing on floor level
            if (event.key === ' ' && isGrounded) {
                verticalVelocity = 0.35;
                isGrounded = false;
                moved = true;
            }
            
            // Map limits to prevent users bounding off edge boundaries
            cube.position.x = Math.max(-14, Math.min(14, cube.position.x));
            cube.position.z = Math.max(-14, Math.min(14, cube.position.z));

            if (moved) {
                broadcastMovement();
            }
        });

        // ==========================================
        // 7. TOUCHSCREEN MOBILE CONTROLLER LOGIC
        // ==========================================
        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');

        const isMobileTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 1024;
        if (isMobileTouch) {
            zone.style.display = 'block';
        }

        let joystickActive = false;
        let startX = 0, startY = 0;

        zone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = zone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;

            const touch = e.touches[0];
            let deltaX = touch.clientX - startX;
            let deltaY = touch.clientY - startY;

            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40; 
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Map mobile translation values to 3D Ground Coordinates (X & Z Plane)
            cube.position.x += (deltaX / maxRadius) * 0.1;
            cube.position.z += (deltaY / maxRadius) * 0.1; 

            // Environment floor limits boundaries containment check 
            cube.position.x = Math.max(-14, Math.min(14, cube.position.x));
            cube.position.z = Math.max(-14, Math.min(14, cube.position.z));

            broadcastMovement();

        }, { passive: false });
        window.addEventListener('touchend', () => {
        joystickActive = false;
        stick.style.transform = 'translate(0px, 0px)';
        });
        // Window resize adaptation handler
        window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // ==========================================
        // 8. CONTINUOUS FRAME RE-DRAW ANIMATION LOOP
        // ==========================================
        function animate() {
        requestAnimationFrame(animate);
        // --- KINEMATIC GRAVITY ENGINE SIMULATION ---
        if (!isGrounded) {
        verticalVelocity += gravity; // Pull downwards over time
        cube.position.y += verticalVelocity;
        // Floor plane boundary checking threshold (bottom height box matching 1)
        if (cube.position.y <= 1) {
        cube.position.y = 1;
        verticalVelocity = 0;
        isGrounded = true;
        }
        broadcastMovement(); // Share ongoing falling updates with peer networks
        }
        // Continuous mesh presentation rotation
        cube.rotation.x += 0.005;
        cube.rotation.y += 0.005;
        for (let id in remotePlayers) {
        remotePlayers[id].rotation.x += 0.005;
        remotePlayers[id].rotation.y += 0.005;
        }
        renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
