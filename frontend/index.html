<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Video Game</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
        }
        
        /* Touchscreen Joystick Outer Ring styling */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none; /* Stops mobile browser zooming when dragging thumb */
            display: none;      /* Hidden by default on computer displays */
        }

        /* Touchscreen Joystick Inner Red Thumb Knob styling */
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Invisible by default on computer desktop displays -->
    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP THE 3D SCENE & ENGINE CANVAS
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. CREATE YOUR CHARACTER TOKEN (GREEN CUBE)
        // ==========================================
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 8;

        // ==========================================
        // 3. PERSISTENT LIVE WEBSOCKET SERVER TUNNEL
        // ==========================================
        const socket = new WebSocket('wss://dnd-video-game.onrender.com');
        const remotePlayers = {};
        
        // Random alpha-numeric Session ID marker (e.g., "z4b9a")
        socket.playerId = Math.random().toString(36).substring(7);

        // ==========================================
        // 4. LISTENING FOR MOVEMENT SIGNALS FROM FRIENDS
        // ==========================================
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Only parse data if it comes from another device player ID
            if (data.id !== socket.playerId) {
                // If a new friend connects, build a distinct Red Cube token map position marker
                if (!remotePlayers[data.id]) {
                    const remoteGeometry = new THREE.BoxGeometry(2, 2, 2);
                    const remoteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                    remotePlayers[data.id] = new THREE.Mesh(remoteGeometry, remoteMaterial);
                    scene.add(remotePlayers[data.id]);
                }
                
                // Track current target positions
                remotePlayers[data.id].position.x = data.x;
                remotePlayers[data.id].position.y = data.y;
            }
        };

        // ==========================================
        // 5. LAPTOP & COMPUTER ARROW KEYBOARD INPUTS
        // ==========================================
        window.addEventListener('keydown', (event) => {
            let moved = false;
            
            if (event.key === 'ArrowUp' || event.key === 'w') { cube.position.y += 0.2; moved = true; }
            if (event.key === 'ArrowDown' || event.key === 's') { cube.position.y -= 0.2; moved = true; }
            if (event.key === 'ArrowLeft' || event.key === 'a') { cube.position.x -= 0.2; moved = true; }
            if (event.key === 'ArrowRight' || event.key === 'd') { cube.position.x += 0.2; moved = true; }
            
            // Broadcast your newly updated frame position values instantly to Render
            if (moved && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }
        });

        // ==========================================
        // 6. TOUCHSCREEN MOBILE CONTROLLER LOGIC
        // ==========================================
        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');

        // Automatic device detection: unhide joystick container element context for touch screen types
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            zone.style.display = 'block';
        }

        let joystickActive = false;
        let startX = 0, startY = 0;

        // Thumb contact initiated
        zone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = zone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        // Thumb dragging behavior
        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;

            const touch = e.touches[0];
            let deltaX = touch.clientX - startX;
            let deltaY = touch.clientY - startY;

            // Enforce layout perimeter borders constraints rule calculations math
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40; 
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            // Update visible element location shifts styles
            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // Compute grid movements updates coordinates vector modifications maps
            cube.position.x += (deltaX / maxRadius) * 0.1;
            cube.position.y -= (deltaY / maxRadius) * 0.1; // Inverted alignment matching layout view mechanics

            // Broadcast real-time canvas movements packet text strings up to backend routing engine
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }
        }, { passive: false });

        // Thumb lifted up
        window.addEventListener('touchend', () => {
            joystickActive = false;
            stick.style.transform = 'translate(0px, 0px)'; // Center reset
        });

        // ==========================================
        // 7. CONTINUOUS FRAME RE-DRAW ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            
            // Native rotation spinning behaviors engine values
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            
            // Apply identical physics rotation spinning loops tracking parameters down for friend targets
            for (let id in remotePlayers) {
                remotePlayers[id].rotation.x += 0.005;
                remotePlayers[id].rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
