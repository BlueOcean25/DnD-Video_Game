<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Video Game - 3D Environment</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #weather-status {
            position: fixed;
            top: 48px;
            left: 12px;
            z-index: 11;
            display: grid;
            gap: 3px;
            padding: 6px 9px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-size: 13px;
            pointer-events: none;
        }
        #auth-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.82);
            color: white;
        }
        #auth-overlay[hidden] {
            display: none;
        }
        #auth-panel {
            box-sizing: border-box;
            width: min(90vw, 360px);
            padding: 24px;
            border: 1px solid #666;
            border-radius: 8px;
            background: #222;
        }
        #auth-panel h1 {
            margin-top: 0;
            font-size: 24px;
        }
        #auth-panel input,
        #auth-panel select,
        #auth-panel button,
        #settings-panel input,
        #settings-panel button {
            box-sizing: border-box;
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            font: inherit;
        }
        #auth-panel button,
        #settings-panel button {
            cursor: pointer;
        }
        #settings-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 12;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }
        #settings-toggle[hidden],
        #settings-panel[hidden] {
            display: none;
        }
        #settings-panel {
            position: fixed;
            top: 56px;
            right: 12px;
            z-index: 12;
            box-sizing: border-box;
            width: min(92vw, 360px);
            padding: 20px;
            border: 1px solid #666;
            border-radius: 8px;
            background: #222;
            color: white;
        }
        #settings-panel h2 {
            margin-top: 0;
        }
        #auth-status,
        #settings-status {
            overflow-wrap: anywhere;
        }
        #update-banner {
            position: fixed;
            top: 12px;
            left: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            box-sizing: border-box;
            width: min(92vw, 640px);
            padding: 12px;
            transform: translateX(-50%);
            border: 1px solid #d6a83b;
            border-radius: 8px;
            background: #332b17;
            color: white;
        }
        #update-banner[hidden] {
            display: none;
        }
        #update-message {
            flex: 1;
        }
        #update-banner button {
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }
        #version-label {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 11;
            padding: 6px 9px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 12px;
        }

        /* Touchscreen Joystick Outer Ring styling */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            display: none;
        }

        /* Touchscreen Joystick Inner Red Thumb Knob styling */
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Touchscreen jump control */
        #jump-button {
            position: fixed;
            z-index: 5;
            right: 40px;
            bottom: 50px;
            width: 80px;
            height: 80px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            background: rgba(0, 180, 0, 0.7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            touch-action: none;
            user-select: none;
        }
    </style>
    <script>
        (() => {
            const serverUrl = 'wss://dnd-video-game.onrender.com';
            let startupFailed = false;

            function setStartupStatus(message) {
                window.dndStartupStatus = message;
                const status = document.getElementById('auth-status');
                if (status) status.textContent = message;
            }

            window.addEventListener('error', (event) => {
                if (event.target !== window) return;
                startupFailed = true;
                setStartupStatus(
                    'The game could not start because a browser script failed. Reload the page or try another browser.'
                );
            });

            window.addEventListener('unhandledrejection', () => {
                startupFailed = true;
                setStartupStatus(
                    'The game could not start because a browser script failed. Reload the page or try another browser.'
                );
            });

            document.addEventListener('DOMContentLoaded', () => {
                if (window.dndStartupStatus) {
                    setStartupStatus(window.dndStartupStatus);
                }
            });

            try {
                const connection = new WebSocket(serverUrl);
                window.dndGameSocket = connection;
                connection.addEventListener('open', () => {
                    if (!startupFailed) {
                        setStartupStatus('Connected. Starting the game...');
                    }
                }, { once: true });
                connection.addEventListener('error', () => {
                    if (!startupFailed) {
                        setStartupStatus(
                            'Could not reach the game server. Retrying the connection...'
                        );
                    }
                }, { once: true });
                window.setTimeout(() => {
                    if (
                        connection.readyState === WebSocket.CONNECTING
                        && !startupFailed
                    ) {
                        setStartupStatus(
                            'The server is taking too long to respond. Retrying the connection...'
                        );
                    }
                }, 30000);
            } catch (error) {
                setStartupStatus(
                    'This browser could not open a game-server connection. Try another browser or network.'
                );
            }
        })();
    </script>
    <!-- WebGL 3D graphics rendering core blueprint library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="auth-overlay">
        <section id="auth-panel" aria-labelledby="auth-title">
            <h1 id="auth-title">Log in to play</h1>
            <div id="login-form">
                <label for="login-identifier">Name or username</label>
                <input id="login-identifier" autocomplete="username" required>
                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" required>
                <button id="login-button" type="button">Log in</button>
                <button id="show-reset-button" type="button">Forgot password?</button>
            </div>
            <div id="reset-form" hidden>
                <label for="reset-name">Select your name</label>
                <select id="reset-name" required>
                    <option value="">Loading accounts...</option>
                </select>
                <button id="request-code-button" type="button">Request reset code</button>
                <p>After requesting a code, ask an administrator to send it to you.</p>
                <label for="reset-code">Reset code</label>
                <input id="reset-code" autocomplete="one-time-code">
                <label for="new-password">New password (at least 8 characters)</label>
                <input id="new-password" type="password" autocomplete="new-password">
                <button id="reset-password-button" type="button">Reset password</button>
                <button id="back-to-login-button" type="button">Back to log in</button>
            </div>
            <p id="auth-status" role="status" aria-live="polite">Connecting to the game server...</p>

    </div>

    <div id="version-label"></div>
    <button id="settings-toggle" type="button" hidden aria-expanded="false" aria-controls="settings-panel">
        Settings
    </button>
    <section id="settings-panel" hidden role="dialog" aria-modal="false" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <form id="change-password-form">
            <label for="current-password">Current password</label>
            <input id="current-password" type="password" autocomplete="current-password" required>
            <label for="settings-new-password">New password (8–72 UTF-8 bytes or 8 - 72 standard characters)</label>
            <input id="settings-new-password" type="password" autocomplete="new-password" required>
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" autocomplete="new-password" required>
            <button type="submit">Change password</button>
        </form>
        <p id="settings-status" role="status" aria-live="polite"></p>
        <button id="close-settings-button" type="button">Close settings</button>
    </section>

    <aside id="update-banner" hidden role="status" aria-live="polite">
        <span id="update-message"></span>
        <button id="reload-update-button" type="button">Reload now</button>
        <button id="dismiss-update-button" type="button">Later</button>
    </aside>

    <div id="weather-status" role="status" aria-live="off">
        <span id="game-time"></span>
        <span id="wind-status"></span>
    </div>
    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>
    <button id="jump-button" type="button">JUMP</button>

    <script>
        const MAP_RADIUS = 128;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(scene.background, 100, 240);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const hemisphereLight = new THREE.HemisphereLight(0xddeeff, 0x527342, 1.8);
        scene.add(hemisphereLight);
        const sunlight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunlight.position.set(-40, 80, 30);
        scene.add(sunlight);

        const grassCanvas = document.createElement('canvas');
        grassCanvas.width = 512;
        grassCanvas.height = 512;
        const grassContext = grassCanvas.getContext('2d');
        grassContext.fillStyle = '#557d38';
        grassContext.fillRect(0, 0, grassCanvas.width, grassCanvas.height);
        for (let patch = 0; patch < 180; patch += 1) {
            const x = Math.random() * grassCanvas.width;
            const y = Math.random() * grassCanvas.height;
            const radius = 8 + Math.random() * 32;
            grassContext.fillStyle = `rgba(${30 + Math.floor(Math.random() * 40)}, ${48 + Math.floor(Math.random() * 50)}, 20, 0.12)`;
            grassContext.beginPath();
            grassContext.ellipse(x, y, radius, radius * (0.35 + Math.random() * 0.5), Math.random() * Math.PI, 0, Math.PI * 2);
            grassContext.fill();
        }
        for (let blade = 0; blade < 14000; blade += 1) {
            const x = Math.random() * grassCanvas.width;
            const y = Math.random() * grassCanvas.height;
            const height = 3 + Math.random() * 11;
            const lean = (Math.random() - 0.5) * height * 0.9;
            const green = Math.floor(75 + Math.random() * 115);
            const red = Math.floor(35 + Math.random() * 45);
            grassContext.strokeStyle = `rgba(${red}, ${green}, ${Math.floor(24 + green * 0.32)}, ${0.25 + Math.random() * 0.55})`;
            grassContext.lineWidth = 0.45 + Math.random() * 1.15;
            grassContext.beginPath();
            grassContext.moveTo(x, y);
            grassContext.quadraticCurveTo(
                x + lean * 0.35,
                y - height * 0.55,
                x + lean,
                y - height
            );
            grassContext.stroke();
        }
        const grassTexture = new THREE.CanvasTexture(grassCanvas);
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(3, 3);
        const floorGeo = new THREE.CircleGeometry(MAP_RADIUS, 128);
        const floorMat = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            map: grassTexture,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function createGrassClumpGeometry() {
            const positions = [];
            const indices = [];
            const bladeDirections = [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3];
            const segments = 3;
            const width = 0.045;
            const height = 0.72;

            for (const angle of bladeDirections) {
                const directionX = Math.sin(angle);
                const directionZ = Math.cos(angle);
                const sideX = directionZ;
                const sideZ = -directionX;
                const firstVertex = positions.length / 3;

                for (let segment = 0; segment <= segments; segment += 1) {
                    const progress = segment / segments;
                    const bend = progress * progress * 0.14;
                    const bladeWidth = width * (1 - progress * 0.88);
                    const centerX = directionX * bend;
                    const centerZ = directionZ * bend;
                    const y = height * progress;
                    positions.push(
                        centerX - sideX * bladeWidth,
                        y,
                        centerZ - sideZ * bladeWidth,
                        centerX + sideX * bladeWidth,
                        y,
                        centerZ + sideZ * bladeWidth
                    );

                    if (segment < segments) {
                        const left = firstVertex + segment * 2;
                        const right = left + 1;
                        indices.push(left, right, left + 2, right, right + 2, left + 2);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
                'position',
                new THREE.Float32BufferAttribute(positions, 3)
            );
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            return geometry;
        }

        const grassBladeCount =
            ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 2200 : 6500;
        const grassBladeGeometry = createGrassClumpGeometry();
        const grassBladeMaterial = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            vertexColors: true,
            side: THREE.DoubleSide
        });
        const grassBlades = new THREE.InstancedMesh(
            grassBladeGeometry,
            grassBladeMaterial,
            grassBladeCount
        );
        const grassBladeTransform = new THREE.Object3D();
        const grassBladeColor = new THREE.Color();

        for (let blade = 0; blade < grassBladeCount; blade += 1) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.sqrt(Math.random()) * (MAP_RADIUS - 0.5);
            grassBladeTransform.position.set(
                Math.cos(angle) * distance,
                0.025,
                Math.sin(angle) * distance
            );
            grassBladeTransform.rotation.y = Math.random() * Math.PI * 2;
            const scale = 0.55 + Math.random() * 0.9;
            grassBladeTransform.scale.set(
                scale * (0.75 + Math.random() * 0.5),
                scale,
                scale * (0.75 + Math.random() * 0.5)
            );
            grassBladeTransform.updateMatrix();
            grassBlades.setMatrixAt(blade, grassBladeTransform.matrix);
            grassBladeColor.setHSL(
                0.24 + Math.random() * 0.08,
                0.48 + Math.random() * 0.3,
                0.3 + Math.random() * 0.23
            );
            grassBlades.setColorAt(blade, grassBladeColor);
        }
        grassBlades.instanceMatrix.needsUpdate = true;
        if (grassBlades.instanceColor) grassBlades.instanceColor.needsUpdate = true;
        grassBlades.computeBoundingSphere();
        scene.add(grassBlades);

        const boundary = new THREE.Mesh(
            new THREE.TorusGeometry(MAP_RADIUS, 0.3, 8, 128),
            new THREE.MeshLambertMaterial({ color: 0x49652f })
        );
        boundary.rotation.x = -Math.PI / 2;
        boundary.position.y = 0.05;
        scene.add(boundary);

        const cameraYaw = { value: 0 };
        const cameraPitch = { value: 0.52 };
        let cameraDistance = 18;
        let orbitPointerId = null;
        let previousPointerX = 0;
        let previousPointerY = 0;
        const orbitPointers = new Map();
        let previousPinchDistance = null;
        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            orbitPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            renderer.domElement.setPointerCapture(event.pointerId);
            if (orbitPointers.size === 2) {
                const points = [...orbitPointers.values()];
                previousPinchDistance = Math.hypot(
                    points[0].x - points[1].x,
                    points[0].y - points[1].y
                );
                orbitPointerId = null;
                return;
            }
            if (orbitPointers.size !== 1) return;
            orbitPointerId = event.pointerId;
            previousPointerX = event.clientX;
            previousPointerY = event.clientY;
        });
        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!orbitPointers.has(event.pointerId)) return;
            orbitPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            if (orbitPointers.size === 2) {
                const points = [...orbitPointers.values()];
                const pinchDistance = Math.hypot(
                    points[0].x - points[1].x,
                    points[0].y - points[1].y
                );
                if (previousPinchDistance > 0 && pinchDistance > 0) {
                    cameraDistance *= previousPinchDistance / pinchDistance;
                    cameraDistance = Math.max(7, Math.min(48, cameraDistance));
                }
                previousPinchDistance = pinchDistance;
                return;
            }
            if (event.pointerId !== orbitPointerId) return;
            cameraYaw.value -= (event.clientX - previousPointerX) * 0.006;
            cameraPitch.value = Math.max(
                0.12,
                Math.min(1.35, cameraPitch.value + (event.clientY - previousPointerY) * 0.004)
            );
            previousPointerX = event.clientX;
            previousPointerY = event.clientY;
        });
        const stopOrbit = (event) => {
            orbitPointers.delete(event.pointerId);
            if (event.pointerId === orbitPointerId) orbitPointerId = null;
            previousPinchDistance = null;
            if (orbitPointers.size === 1) {
                const [[pointerId, point]] = orbitPointers.entries();
                orbitPointerId = pointerId;
                previousPointerX = point.x;
                previousPointerY = point.y;
            }
        };
        renderer.domElement.addEventListener('pointerup', stopOrbit);
        renderer.domElement.addEventListener('pointercancel', stopOrbit);
        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            cameraDistance = Math.max(
                7,
                Math.min(48, cameraDistance + event.deltaY * 0.025)
            );
        }, { passive: false });

        const gameTimeLabel = document.getElementById('game-time');
        const windStatusLabel = document.getElementById('wind-status');
        const compassDirections = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        const weatherStepMilliseconds = 18000;
        const wind = { speed: 0, direction: 0 };

        function weatherForStep(step) {
            let seed = (step >>> 0) || 1;
            const nextRandom = () => {
                seed ^= seed << 13;
                seed ^= seed >>> 17;
                seed ^= seed << 5;
                return (seed >>> 0) / 4294967296;
            };
            return {
                speed: nextRandom() * 45,
                direction: nextRandom() * Math.PI * 2
            };
        }

        const gameDayDuration = 12 * 60 * 1000;
        const skyTimeColors = [
            { time: 0, color: new THREE.Color(0x08152e) },
            { time: 0.20, color: new THREE.Color(0x172b50) },
            { time: 0.25, color: new THREE.Color(0xf39b72) },
            { time: 0.31, color: new THREE.Color(0x87ceeb) },
            { time: 0.70, color: new THREE.Color(0x87ceeb) },
            { time: 0.76, color: new THREE.Color(0xf39b72) },
            { time: 0.82, color: new THREE.Color(0x172b50) },
            { time: 1, color: new THREE.Color(0x08152e) }
        ];
        const skyColor = new THREE.Color();
        const dayGrassColor = new THREE.Color(0x9abf68);
        const nightGrassColor = new THREE.Color(0x35452a);
        const dawnGrassColor = new THREE.Color(0x806b42);
        const grassColor = new THREE.Color();
        const tempColor = new THREE.Color();
        const sunDirection = new THREE.Vector3();

        function interpolateColor(stops, time, target) {
            let upperIndex = stops.findIndex((stop) => stop.time >= time);
            if (upperIndex <= 0) return target.copy(stops[0].color);
            const lower = stops[upperIndex - 1];
            const upper = stops[upperIndex];
            const amount = (time - lower.time) / (upper.time - lower.time);
            return target.copy(lower.color).lerp(upper.color, amount);
        }

        function updateWeather(now) {
            const weatherStep = Math.floor(now / weatherStepMilliseconds);
            const previousWeather = weatherForStep(weatherStep - 1);
            const targetWeather = weatherForStep(weatherStep);
            const progress = Math.min(
                (now % weatherStepMilliseconds) / 3500,
                1
            );
            const blend = progress * progress * (3 - 2 * progress);
            wind.speed = previousWeather.speed
                + (targetWeather.speed - previousWeather.speed) * blend;
            const directionDifference = Math.atan2(
                Math.sin(targetWeather.direction - previousWeather.direction),
                Math.cos(targetWeather.direction - previousWeather.direction)
            );
            wind.direction = previousWeather.direction + directionDifference * blend;
            const speedFactor = Math.min(wind.speed / 45, 1);
            const hueShift = Math.cos(wind.direction) * 0.018;
            const dayProgress = (now % gameDayDuration) / gameDayDuration;
            const gameHours = dayProgress * 24;
            interpolateColor(skyTimeColors, dayProgress, skyColor);
            tempColor.setHSL(0.57 + hueShift, 0.48 - speedFactor * 0.2, 0.72 - speedFactor * 0.2);
            skyColor.lerp(tempColor, 0.16 + speedFactor * 0.24);
            scene.background.copy(skyColor);
            scene.fog.color.copy(skyColor);
            const daylight = Math.max(0, Math.sin((dayProgress - 0.25) * Math.PI * 2));
            grassColor.copy(nightGrassColor).lerp(dayGrassColor, daylight);
            grassColor.lerp(dawnGrassColor, Math.max(0, 1 - Math.abs(dayProgress - 0.25) / 0.08) * 0.45);
            grassColor.offsetHSL(
                Math.sin(wind.direction) * 0.012,
                -speedFactor * 0.04,
                -speedFactor * 0.08
            );
            floorMat.color.copy(grassColor);
            sunlight.intensity = 0.12 + daylight * 1.35;
            hemisphereLight.intensity = 0.2 + daylight * 1.5;
            const sunAngle = dayProgress * Math.PI * 2;
            sunDirection.set(Math.cos(sunAngle), Math.sin(sunAngle), 0.35).normalize();
            sunlight.position.copy(sunDirection).multiplyScalar(90);
            const compassIndex = Math.round(
                ((wind.direction + Math.PI * 2) % (Math.PI * 2)) / (Math.PI / 4)
            ) % compassDirections.length;
            const hours = Math.floor(gameHours).toString().padStart(2, '0');
            const minutes = Math.floor((gameHours % 1) * 60).toString().padStart(2, '0');
            gameTimeLabel.textContent = `Time: ${hours}:${minutes}`;
            windStatusLabel.textContent =
                `Wind: ${wind.speed.toFixed(1)} km/h · ${compassDirections[compassIndex]}`;
        }

        const gravity = -54;
        const jumpVelocity = 21;
        const movementSpeed = 6;
        const pressedKeys = new Set();
        const joystickInput = { x: 0, y: 0 };
        let verticalVelocity = 0;
        let isGrounded = true;
        let lastMovementBroadcastAt = 0;

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);

        cube.position.set(0, 1, 0);
        scene.add(cube);
        camera.position.set(
            0,
            cube.position.y + 1 + Math.sin(cameraPitch.value) * cameraDistance,
            Math.cos(cameraPitch.value) * cameraDistance
        );
        camera.lookAt(cube.position.x, cube.position.y + 1, cube.position.z);

        const APP_VERSION = 'v0.6.10-alpha';
        document.getElementById('version-label').textContent = APP_VERSION;
        let socket;
        const remotePlayers = {};
        const authOverlay = document.getElementById('auth-overlay');
        const loginForm = document.getElementById('login-form');
        const resetForm = document.getElementById('reset-form');
        const authStatus = document.getElementById('auth-status');
        const resetName = document.getElementById('reset-name');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsStatus = document.getElementById('settings-status');
        const updateBanner = document.getElementById('update-banner');
        const updateMessage = document.getElementById('update-message');
        let isAuthenticated = false;
        let reloginRequired = false;
        let availableUpdateVersion = '';
        let dismissedUpdateVersion = '';

        const playerId = Math.random().toString(36).substring(7);

        function playerPositionMessage(type, id) {
            return {
                type,
                id,
                x: cube.position.x,
                y: cube.position.y,
                z: cube.position.z
            };
        }

        function sendAuthMessage(data) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                const status = settingsPanel.hidden ? authStatus : settingsStatus;
                status.textContent = 'The game server is not connected. Please try again.';
                return;
            }
            socket.send(JSON.stringify(data));
        }

        function connectToServer() {
            let connection = window.dndGameSocket;
            if (
                !connection
                || (
                    connection.readyState !== WebSocket.CONNECTING
                    && connection.readyState !== WebSocket.OPEN
                )
            ) {
                connection = new WebSocket('wss://dnd-video-game.onrender.com');
                window.dndGameSocket = connection;
            }
            connection.playerId = playerId;
            socket = connection;
            let connectionTimedOut = false;
            const connectionTimeout = window.setTimeout(() => {
                if (connection.readyState !== WebSocket.CONNECTING) return;
                connectionTimedOut = true;
                authStatus.textContent =
                    'The server is taking too long to respond. Retrying the connection...';
                connection.close();
            }, 30000);

            connection.onopen = function() {
                window.clearTimeout(connectionTimeout);
                authStatus.textContent = reloginRequired
                    ? 'Connection restored. Log in again to rejoin.'
                    : 'Connected. Log in or reset your password.';
                sendAuthMessage({ type: 'check_version', version: APP_VERSION });
                sendAuthMessage({ type: 'get_account_names' });
            };

            connection.onerror = function() {
                if (socket === connection) {
                    authStatus.textContent =
                        'Could not reach the game server. Retrying the connection...';
                }
            };

            connection.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'update_available') {
                    availableUpdateVersion = data.version;
                    updateMessage.textContent =
                        `Update ${data.version} is available. Reload the page to get the latest version.`;
                    if (dismissedUpdateVersion !== data.version) {
                        updateBanner.hidden = false;
                    }
                    return;
                }

                if (data.type === 'account_names') {
                    resetName.replaceChildren(new Option('Choose your name', ''));
                    for (const name of data.names) {
                        resetName.add(new Option(name, name));
                    }
                    return;
                }

                if (data.type === 'login_result') {
                    if (!data.success) {
                        authStatus.textContent = 'Login failed. Check your name and password.';
                        return;
                    }
                    isAuthenticated = true;
                    reloginRequired = false;
                    authOverlay.hidden = true;
                    settingsToggle.hidden = false;
                    authStatus.textContent = '';
                    connection.send(JSON.stringify(
                        playerPositionMessage('join', connection.playerId)
                    ));
                    return;
                }

                if (data.type === 'reset_code_result') {
                    if (!data.success) {
                        authStatus.textContent = 'Could not request a code for that account.';
                        return;
                    }
                    authStatus.textContent = 'Request saved. Ask an administrator to send you the reset code.';
                    return;
                }

                if (data.type === 'password_reset_result') {
                    authStatus.textContent = data.success
                        ? 'Password reset. Return to log in and use your new password.'
                        : 'Password reset failed. Check the name, code, and password requirements.';
                    return;
                }

                if (data.type === 'change_password_result') {
                    if (data.success) {
                        document.getElementById('change-password-form').reset();
                        settingsStatus.textContent = 'Password changed successfully.';
                    } else {
                        settingsStatus.textContent =
                            'Password change failed. Check your current password and new password requirements.';
                    }
                    return;
                }

                if (data.type === 'auth_error') {
                    if (!settingsPanel.hidden) {
                        settingsStatus.textContent = data.message;
                    } else {
                        authStatus.textContent = data.message;
                    }
                    return;
                }

                if (data.type === 'restore_position' && data.position) {
                    cube.position.set(
                        data.position.x,
                        data.position.y,
                        data.position.z
                    );
                    clampPlayerPosition();
                    return;
                }

                if (data.id === connection.playerId) return;

                if (data.type === 'join') {
                    connection.send(JSON.stringify(
                        playerPositionMessage('reply', connection.playerId)
                    ));
                }

                if (data.type === 'leave') {
                    if (remotePlayers[data.id]) {
                        scene.remove(remotePlayers[data.id]);
                        remotePlayers[data.id].geometry.dispose();
                        remotePlayers[data.id].material.dispose();
                        delete remotePlayers[data.id];
                    }
                    return;
                }

                if (!remotePlayers[data.id]) {
                    const remoteGeometry = new THREE.BoxGeometry(2, 2, 2);
                    const remoteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                    remotePlayers[data.id] = new THREE.Mesh(remoteGeometry, remoteMaterial);
                    scene.add(remotePlayers[data.id]);
                }

                remotePlayers[data.id].position.x = data.x;
                remotePlayers[data.id].position.y = data.y;
                remotePlayers[data.id].position.z = data.z !== undefined ? data.z : 0;
            };

            connection.onclose = function() {
                if (socket !== connection) return;
                window.clearTimeout(connectionTimeout);
                if (isAuthenticated) {
                    isAuthenticated = false;
                    reloginRequired = true;
                    authOverlay.hidden = false;
                    settingsToggle.hidden = true;
                    settingsPanel.hidden = true;
                    settingsToggle.setAttribute('aria-expanded', 'false');
                    document.getElementById('change-password-form').reset();
                }
                if (!connectionTimedOut) {
                    authStatus.textContent =
                        'Connection closed. Reconnecting to the game server...';
                }
                window.setTimeout(connectToServer, 3000);
            };

            if (connection.readyState === WebSocket.OPEN) {
                connection.onopen();
            }
        }

        connectToServer();
        window.setInterval(() => {
            sendAuthMessage({ type: 'check_version', version: APP_VERSION });
        }, 30000);

        document.getElementById('reload-update-button').addEventListener('click', () => {
            window.location.reload();
        });
        document.getElementById('dismiss-update-button').addEventListener('click', () => {
            dismissedUpdateVersion = availableUpdateVersion;
            updateBanner.hidden = true;
        });
        settingsToggle.addEventListener('click', () => {
            settingsPanel.hidden = !settingsPanel.hidden;
            settingsToggle.setAttribute('aria-expanded', String(!settingsPanel.hidden));
            if (!settingsPanel.hidden) {
                settingsStatus.textContent = '';
                document.getElementById('current-password').focus();
            }
        });
        document.getElementById('close-settings-button').addEventListener('click', () => {
            settingsPanel.hidden = true;
            settingsToggle.setAttribute('aria-expanded', 'false');
            document.getElementById('change-password-form').reset();
        });
        document.getElementById('change-password-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('settings-new-password').value;
            const confirmation = document.getElementById('confirm-password').value;
            if (newPassword.length < 8 || new TextEncoder().encode(newPassword).length > 72) {
                settingsStatus.textContent =
                    'Choose a new password between 8 and 72 UTF-8 bytes.';
                return;
            }
            if (newPassword !== confirmation) {
                settingsStatus.textContent = 'The new passwords do not match.';
                return;
            }
            sendAuthMessage({
                type: 'change_password',
                current_password: document.getElementById('current-password').value,
                new_password: newPassword
            });
            settingsStatus.textContent = 'Updating password...';
        });

        function broadcastMovement() {
            if (isAuthenticated && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(
                    playerPositionMessage('move', socket.playerId)
                ));
            }
        }

        function clampPlayerPosition() {
            const distance = Math.hypot(cube.position.x, cube.position.z);
            const limit = MAP_RADIUS - 1;
            if (distance > limit) {
                cube.position.x *= limit / distance;
                cube.position.z *= limit / distance;
            }
        }

        function jump() {
            if (!isAuthenticated || !isGrounded) return false;
            verticalVelocity = jumpVelocity;
            isGrounded = false;
            return true;
        }

        document.getElementById('login-button').addEventListener('click', () => {
            authStatus.textContent = 'Checking login...';
            sendAuthMessage({
                type: 'login',
                identifier: document.getElementById('login-identifier').value.trim(),
                password: document.getElementById('login-password').value
            });
        });

        document.getElementById('show-reset-button').addEventListener('click', () => {
            loginForm.hidden = true;
            resetForm.hidden = false;
            authStatus.textContent = 'Select your name to request a password-reset code.';
        });

        document.getElementById('back-to-login-button').addEventListener('click', () => {
            resetForm.hidden = true;
            loginForm.hidden = false;
            authStatus.textContent = 'Log in with your account.';
        });

        document.getElementById('request-code-button').addEventListener('click', () => {
            if (!resetName.value) {
                authStatus.textContent = 'Select your name first.';
                return;
            }
            sendAuthMessage({ type: 'request_reset_code', name: resetName.value });
        });

        document.getElementById('reset-password-button').addEventListener('click', () => {
            const password = document.getElementById('new-password').value;
            if (password.length < 8) {
                authStatus.textContent = 'Choose a password with at least 8 characters.';
                return;
            }
            sendAuthMessage({
                type: 'reset_password',
                name: resetName.value,
                code: document.getElementById('reset-code').value.trim(),
                password
            });
        });

        function isTypingTarget(target) {
            return target instanceof HTMLElement
                && target.matches('input, textarea, select, button, [contenteditable="true"]');
        }

        const movementKeys = new Set([
            'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'
        ]);
        window.addEventListener('keydown', (event) => {
            if (!isAuthenticated || isTypingTarget(event.target)) return;
            const key = event.key.toLowerCase();
            if (movementKeys.has(key)) {
                pressedKeys.add(key);
                event.preventDefault();
            } else if (event.code === 'Space') {
                event.preventDefault();
                if (!event.repeat && jump()) broadcastMovement();
            }
        });
        window.addEventListener('keyup', (event) => {
            pressedKeys.delete(event.key.toLowerCase());
        });
        window.addEventListener('blur', () => {
            pressedKeys.clear();
            joystickInput.x = 0;
            joystickInput.y = 0;
            stick.style.transform = 'translate(0px, 0px)';
        });

        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');
        const jumpButton = document.getElementById('jump-button');

        const isMobileTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 1024;
        if (isMobileTouch) {
            zone.style.display = 'block';
            jumpButton.style.display = 'flex';
        }

        jumpButton.addEventListener('click', () => {
            if (jump()) broadcastMovement();
        });

        let joystickPointerId = null;
        let startX = 0;
        let startY = 0;
        zone.addEventListener('pointerdown', (event) => {
            if (!isAuthenticated) return;
            joystickPointerId = event.pointerId;
            const rect = zone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
            zone.setPointerCapture(event.pointerId);
        });

        zone.addEventListener('pointermove', (event) => {
            if (!isAuthenticated || event.pointerId !== joystickPointerId) return;
            let deltaX = event.clientX - startX;
            let deltaY = event.clientY - startY;

            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40;
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            joystickInput.x = deltaX / maxRadius;
            joystickInput.y = deltaY / maxRadius;
        });

        const stopJoystick = (event) => {
            if (event.pointerId !== joystickPointerId) return;
            joystickPointerId = null;
            joystickInput.x = 0;
            joystickInput.y = 0;
            stick.style.transform = 'translate(0px, 0px)';
        };
        zone.addEventListener('pointerup', stopJoystick);
        zone.addEventListener('pointercancel', stopJoystick);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let previousFrameTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const deltaTime = Math.min((now - previousFrameTime) / 1000, 0.05);
            previousFrameTime = now;
            updateWeather(Date.now());

            let forwardInput = Number(pressedKeys.has('w') || pressedKeys.has('arrowup'))
                - Number(pressedKeys.has('s') || pressedKeys.has('arrowdown'));
            let rightInput = Number(pressedKeys.has('d') || pressedKeys.has('arrowright'))
                - Number(pressedKeys.has('a') || pressedKeys.has('arrowleft'));
            forwardInput -= joystickInput.y;
            rightInput += joystickInput.x;
            const inputLength = Math.hypot(forwardInput, rightInput);
            let moved = false;
            if (isAuthenticated && inputLength > 0) {
                forwardInput /= Math.max(1, inputLength);
                rightInput /= Math.max(1, inputLength);
                cube.position.x += (
                    -Math.sin(cameraYaw.value) * forwardInput
                    + Math.cos(cameraYaw.value) * rightInput
                ) * movementSpeed * deltaTime;
                cube.position.z += (
                    -Math.cos(cameraYaw.value) * forwardInput
                    - Math.sin(cameraYaw.value) * rightInput
                ) * movementSpeed * deltaTime;
                clampPlayerPosition();
                moved = true;
            }

            if (!isGrounded) {
                verticalVelocity += gravity * deltaTime;
                cube.position.y += verticalVelocity * deltaTime;
                if (cube.position.y <= 1) {
                    cube.position.y = 1;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
                moved = true;
            }
            if (moved && now - lastMovementBroadcastAt >= 100) {
                broadcastMovement();
                lastMovementBroadcastAt = now;
            }

            const cameraTargetX = cube.position.x
                + Math.sin(cameraYaw.value) * Math.cos(cameraPitch.value) * cameraDistance;
            const cameraTargetY = cube.position.y
                + Math.sin(cameraPitch.value) * cameraDistance;
            const cameraTargetZ = cube.position.z
                + Math.cos(cameraYaw.value) * Math.cos(cameraPitch.value) * cameraDistance;
            camera.position.x += (cameraTargetX - camera.position.x) * 0.08;
            camera.position.y += (cameraTargetY - camera.position.y) * 0.08;
            camera.position.z += (cameraTargetZ - camera.position.z) * 0.08;
            camera.lookAt(cube.position.x, cube.position.y + 1, cube.position.z);

            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            for (const id in remotePlayers) {
                remotePlayers[id].rotation.x += 0.005;
                remotePlayers[id].rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
