<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Video Game</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
        }
        
        /* Touchscreen Joystick Outer Ring styling */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none; 
            display: none;      
        }

        /* Touchscreen Joystick Inner Red Thumb Knob styling */
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
    </style>
    <!-- WebGL 3D graphics rendering core blueprint library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <script>
        // ==========================================
        // 1. SETUP THE 3D SCENE & ENGINE CANVAS
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. CREATE YOUR CHARACTER TOKEN (GREEN CUBE)
        // ==========================================
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 8;

        // ==========================================
        // 3. PERSISTENT LIVE WEBSOCKET SERVER TUNNEL
        // ==========================================
        const socket = new WebSocket('wss://dnd-video-game.onrender.com');
        const remotePlayers = {};
        
        socket.playerId = Math.random().toString(36).substring(7);

        // HANDSHAKE SIGNAL: Tell the server we just joined, and request positions!
        socket.onopen = function() {
            socket.send(JSON.stringify({
                type: 'join', 
                id: socket.playerId,
                x: cube.position.x,
                y: cube.position.y
            }));
        };

        // ==========================================
        // 4. LISTENING FOR SIGNALS FROM THE SERVER
        // ==========================================
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.id === socket.playerId) return;

            // AUTOMATIC GREETING REPLY
            if (data.type === 'join') {
                socket.send(JSON.stringify({
                    type: 'reply', 
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }

            // Build or update the red cube for the other player
            if (!remotePlayers[data.id]) {
                const remoteGeometry = new THREE.BoxGeometry(2, 2, 2);
                const remoteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                remotePlayers[data.id] = new THREE.Mesh(remoteGeometry, remoteMaterial);
                scene.add(remotePlayers[data.id]);
            }
            
            remotePlayers[data.id].position.x = data.x;
            remotePlayers[data.id].position.y = data.y;
        };

        // ==========================================
        // 5. LAPTOP & COMPUTER ARROW KEYBOARD INPUTS
        // ==========================================
        window.addEventListener('keydown', (event) => {
            let moved = false;
            
            if (event.key === 'ArrowUp' || event.key === 'w') { cube.position.y += 0.2; moved = true; }
            if (event.key === 'ArrowDown' || event.key === 's') { cube.position.y -= 0.2; moved = true; }
            if (event.key === 'ArrowLeft' || event.key === 'a') { cube.position.x -= 0.2; moved = true; }
            if (event.key === 'ArrowRight' || event.key === 'd') { cube.position.x += 0.2; moved = true; }
            
            // Apply a soft screen boundary check so keyboard players can't leave the camera view area
            cube.position.x = Math.max(-5, Math.min(5, cube.position.x));
            cube.position.y = Math.max(-4, Math.min(4, cube.position.y));

            if (moved && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'move',
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }
        });

        // ==========================================
        // 6. TOUCHSCREEN MOBILE CONTROLLER LOGIC
        // ==========================================
        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');

        const isMobileTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 1024;
        if (isMobileTouch) {
            zone.style.display = 'block';
        }

        let joystickActive = false;
        let startX = 0, startY = 0;

        zone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = zone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;

            const touch = e.touches[0];
            let deltaX = touch.clientX - startX;
            let deltaY = touch.clientY - startY;

            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40; 
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            // **FIXED PHYSICS MATH:** Smoother scaling values to stop the cube from flying away instantly
            cube.position.x += (deltaX / maxRadius) * 0.05;
            cube.position.y -= (deltaY / maxRadius) * 0.05; 

            // **BOUNDARIES LOOKUP MAP:** Locks the player inside a grid so they can never move past the camera eye line
            cube.position.x = Math.max(-5, Math.min(5, cube.position.x));
            cube.position.y = Math.max(-4, Math.min(4, cube.position.y));

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'move',
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            joystickActive = false;
            stick.style.transform = 'translate(0px, 0px)'; 
        });

        // ==========================================
        // 7. CONTINUOUS FRAME RE-DRAW ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            
            for (let id in remotePlayers) {
                remotePlayers[id].rotation.x += 0.005;
                remotePlayers[id].rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
