<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Video Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<body>
    <script>
        // 1. Setup the 3D Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Create YOUR player token (Green Cube)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 8;

        // 3. Connect to your Render Python backend server
        const socket = new WebSocket('wss://dnd-video-game.onrender.com');
        const remotePlayers = {};
        
        // Generate a random unique ID for this player session
        socket.playerId = Math.random().toString(36).substring(7);

        // 4. Handle incoming movement data from other players
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // If the message is from someone else, update their location
            if (data.id !== socket.playerId) {
                // If we haven't seen this friend yet, build a Red Cube for them
                if (!remotePlayers[data.id]) {
                    const remoteGeometry = new THREE.BoxGeometry(2, 2, 2);
                    const remoteMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                    remotePlayers[data.id] = new THREE.Mesh(remoteGeometry, remoteMaterial);
                    scene.add(remotePlayers[data.id]);
                }
                
                // Move their cube to their current coordinates
                remotePlayers[data.id].position.x = data.x;
                remotePlayers[data.id].position.y = data.y;
            }
        };

        // 5. Watch for keyboard clicks to move your own cube
        window.addEventListener('keydown', (event) => {
            let moved = false;
            
            if (event.key === 'ArrowUp' || event.key === 'w') { cube.position.y += 0.2; moved = true; }
            if (event.key === 'ArrowDown' || event.key === 's') { cube.position.y -= 0.2; moved = true; }
            if (event.key === 'ArrowLeft' || event.key === 'a') { cube.position.x -= 0.2; moved = true; }
            if (event.key === 'ArrowRight' || event.key === 'd') { cube.position.x += 0.2; moved = true; }
            
            // If your cube moved, send the coordinates to the Python server instantly
            if (moved && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    id: socket.playerId,
                    x: cube.position.x,
                    y: cube.position.y
                }));
            }
        });

        // 6. Game Loop (Keeps the cube spinning and rendering)
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            
            // Spin your friends' cubes too if they exist
            for (let id in remotePlayers) {
                remotePlayers[id].rotation.x += 0.005;
                remotePlayers[id].rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
